version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ltweb2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nguyenthongoc
      POSTGRES_DB: cafe_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./LT_Web_2-main/LT_Web2
      dockerfile: Dockerfile
      args:
        SKIP_TESTS: "false"
    container_name: ltweb2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cafe_shop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: nguyenthongoc
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: CHANGE_ME_SECRET_BASE64
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./cafe-fe
      dockerfile: Dockerfile
    container_name: ltweb2-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      # Example for CRA runtime variables if needed via .env
      REACT_APP_API_BASE_URL: http://localhost:8088/api

volumes:
  pgdata:
